[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "socratic-tutor"
version = "0.1.0"
description = "Socratic, step-by-step algebra tutor with SymPy checking"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{ name = "Your Name" }]
dependencies = [
    "sympy>=1.13",
    "typer>=0.12",
    "rich>=13.7",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6", "black>=24.0", "mypy>=1.10"]

[project.scripts]
socratic-tutor = "socratic_tutor.cli:app"

[tool.black]
line-length = 100
target-version = ["py310"]

# Ruff: core, formatting, and rules live here
[tool.ruff]
line-length = 100

# NEW (per deprecation notice): move rule sets into [tool.ruff.lint]
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = []

[tool.pytest.ini_options]
testpaths = ["tests"]
